name: Fix TMAP travel-time fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TMAP response handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bath-route/index.html')
          s=p.read_text(encoding='utf-8')
          old="""  let sec=Number(j?.features?.[0]?.properties?.totalTime)||0,path=[];
  if(Array.isArray(j?.features))for(const f of j.features){const t=Number(f?.properties?.totalTime);if(t>sec)sec=t;const g=f?.geometry;if(g?.type==='LineString')for(const p of g.coordinates||[])path.push({lon:Number(p[0]),lat:Number(p[1])});if(g?.type==='MultiLineString')for(const line of g.coordinates||[])for(const p of line)path.push({lon:Number(p[0]),lat:Number(p[1])})}
  if(!sec){const detail=apiMsg||(raw&&raw.length<300?raw:'응답에 totalTime이 없음');throw new Error('TMAP 이동시간 응답 오류: '+detail)}
  const out={mins:Math.max(1,Math.round(sec/60)),path};legMemo.set(k,out);return out
"""
          new="""  const features=Array.isArray(j?.features)?j.features:[];
  let sec=Number(features?.[0]?.properties?.totalTime)||0,path=[],segmentSec=0;
  for(const f of features){
    const total=Number(f?.properties?.totalTime);if(total>sec)sec=total;
    const seg=Number(f?.properties?.time);if(seg>0)segmentSec+=seg;
    const g=f?.geometry;if(g?.type==='LineString')for(const p of g.coordinates||[])path.push({lon:Number(p[0]),lat:Number(p[1])});if(g?.type==='MultiLineString')for(const line of g.coordinates||[])for(const p of line)path.push({lon:Number(p[0]),lat:Number(p[1])})
  }
  if(!sec&&segmentSec>0)sec=segmentSec;
  if(!sec){
    const dx=Math.abs(Number(from.lon)-Number(to.lon)),dy=Math.abs(Number(from.lat)-Number(to.lat));
    if(dx<0.00002&&dy<0.00002){const out={mins:0,path:[]};legMemo.set(k,out);return out}
    const detail=apiMsg||(raw&&raw.length<500?raw:'TMAP 응답에 이동시간 정보가 없음');
    throw new Error('TMAP 이동시간 응답 오류: '+detail)
  }
  const out={mins:Math.max(1,Math.round(sec/60)),path};legMemo.set(k,out);return out
"""
          if old not in s:
              raise SystemExit('target block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/fix-tmap-total-time.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bath-route/index.html .github/workflows/fix-tmap-total-time.yml
          git commit -m "Handle TMAP segment travel times and same-location routes"
          git push
