name: Build Desktop v1 Installer

on:
  push:
    branches: [ main ]
    paths:
      - '.desktop-build/v1_0_1.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Extract project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-src | Out-Null
          Expand-Archive -Path .desktop-build/v1_0_1.zip -DestinationPath desktop-src -Force
      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location desktop-src/joeun_bath_route_desktop_v1_0_1
          npm install
      - name: Build NSIS installer
        shell: pwsh
        run: |
          Set-Location desktop-src/joeun_bath_route_desktop_v1_0_1
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: joeun-bath-route-v1.0.1-installer
          path: desktop-src/joeun_bath_route_desktop_v1_0_1/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
