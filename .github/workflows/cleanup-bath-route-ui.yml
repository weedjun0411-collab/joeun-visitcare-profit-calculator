name: Cleanup bath route UI

on:
  push:
    paths:
      - '.github/workflows/cleanup-bath-route-ui.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean desktop UI and remove lunch logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('bath-route/index.html')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, required=True):
              global s
              if required and old not in s:
                  raise SystemExit('pattern not found: ' + old[:120])
              s = s.replace(old, new)

          rep('html,body{margin:0;min-width:1240px', 'html,body{margin:0;min-width:1180px')
          rep('.app{width:1580px;max-width:calc(100vw - 24px);margin:12px auto 36px}', '.app{width:1480px;max-width:calc(100vw - 28px);margin:14px auto 36px}')
          rep('.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--navy);color:#fff;border-radius:16px;padding:17px 20px;box-shadow:0 7px 24px rgba(23,59,103,.16)}', '.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--navy);color:#fff;border-radius:14px;padding:15px 18px;box-shadow:0 5px 18px rgba(23,59,103,.14)}')
          rep('.brand h1{font-size:26px', '.brand h1{font-size:24px')
          rep('.settings{display:grid;grid-template-columns:1.15fr .9fr 1.45fr auto;gap:9px;margin-top:10px}', '.settings{display:grid;grid-template-columns:minmax(560px,1.65fr) minmax(280px,.8fr) minmax(330px,.9fr);gap:10px;margin-top:10px}')
          rep('.main{display:grid;grid-template-columns:minmax(0,1.68fr) minmax(440px,.82fr);gap:10px;margin-top:10px;align-items:start}', '.main{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(430px,.78fr);gap:12px;margin-top:12px;align-items:start}')
          rep('table{border-collapse:separate;border-spacing:0;width:100%;min-width:980px}', 'table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}')
          rep('.namecol{width:90px}.addrcol{width:270px}.statuscol{width:76px}.dayscol{width:184px}.minscol{width:67px}.pausecol{width:65px}.detailcol{width:72px}.delcol{width:45px}', '.namecol{width:92px}.addrcol{width:310px}.dayscol{width:188px}.minscol{width:70px}.pausecol{width:72px}.detailcol{width:82px}.delcol{width:46px}')
          rep('#map{height:265px', '#map{height:225px')

          extra_css = '''.box-title{font-size:12px;font-weight:950;color:#344054;margin-bottom:8px}.basic-grid{display:grid;grid-template-columns:minmax(280px,2fr) repeat(3,minmax(92px,.55fr));gap:8px;align-items:end}.field{display:block;margin:0}.field span{display:block;font-size:10px;color:#667085;font-weight:900;margin-bottom:4px}.field input{width:100%}.guide-box{display:flex;flex-direction:column;justify-content:center}.guide-list{display:grid;gap:7px;font-size:10px;color:#475467}.guide-list span{display:flex;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1px solid #edf1f5}.guide-list span:last-child{border-bottom:0;padding-bottom:0}.guide-list b{color:var(--navy)}.advanced-box{padding:0;overflow:visible}.advanced-box summary{list-style:none;padding:12px 13px;font-size:12px;font-weight:950;color:#344054;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.advanced-box summary::-webkit-details-marker{display:none}.advanced-box summary:after{content:'▾';color:#98a2b3}.advanced-box[open] summary:after{content:'▴'}.advanced-content{border-top:1px solid #edf1f5;padding:10px 11px 11px}.advanced-content label{display:block}.advanced-content input{width:100%;margin-bottom:8px}.backupbox{justify-content:flex-start}.addresscell{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center}.addrstatus{min-width:44px;text-align:right}.cardhead{padding:14px 15px 10px}.tablefoot{padding:10px 12px 12px}.right .cardhead h2{font-size:17px}.routebar{margin-top:12px}.summary{margin-top:9px}.mapbox{margin-top:10px}.historyrow{margin-top:9px}\n'''
          rep('@media print{', extra_css + '@media print{')

          m = re.search(r'<section class="settings">.*?</section>', s, re.S)
          if not m:
              raise SystemExit('settings block not found')
          new_settings = '''<section class="settings">
            <div class="box">
              <div class="box-title">기본 설정</div>
              <div class="basic-grid">
                <label class="field"><span>센터 출발·복귀 주소</span><input id="centerAddress" placeholder="센터 주소"></label>
                <label class="field"><span>출발</span><input id="startTime" type="time"></label>
                <label class="field"><span>센터 복귀</span><input id="endTime" type="time"></label>
                <label class="field"><span>정리시간(분)</span><input id="bufferMins" type="number" min="0" max="60"></label>
              </div>
            </div>
            <div class="box guide-box">
              <div class="box-title">동선 기준</div>
              <div class="guide-list"><span>고정시간 <b>반드시 맞춤</b></span><span>희망시간 <b>우선 배치</b></span><span>불가시간 <b>방문 제외</b></span></div>
            </div>
            <details class="box advanced-box">
              <summary>연동 · 백업 설정</summary>
              <div class="advanced-content">
                <label>TMAP AppKey<input id="appKey" type="password" placeholder="AppKey 입력"></label>
                <div class="backupbox"><button class="btn primary" id="connectBackup">PC 백업 연결</button><button class="btn" id="restoreBackup">백업 불러오기</button><button class="btn" id="downloadBackup">백업 다운로드</button></div>
              </div>
            </details>
          </section>'''
          s = s[:m.start()] + new_settings + s[m.end():]

          rep('PC용 · 고정시간 / 희망시간 / 불가시간 / 실제 도로 이동시간을 함께 반영', 'TMAP 기반 방문목욕 동선 자동편성')
          rep('요일 체크 후 ‘일정 설정’에서 요일별 고정/희망/불가시간을 입력', '명단은 한 번만 등록하고, 필요한 시간 조건만 별도로 설정')
          rep('<th class="statuscol">주소상태</th>', '')
          rep('<th class="detailcol">일정</th>', '<th class="detailcol">시간 설정</th>')
          rep('선택 날짜의 일시제외까지 반영 · 하루 동선 후보를 폭넓게 비교해 편성', '날짜와 요일을 선택하면 실제 도로시간 기준으로 자동 편성')
          rep('고정시간은 반드시 맞춰야 하는 일정 · 희망시간은 우선 배치 · 불가시간은 절대 배치 안 함', '고정 = 반드시 맞춤 · 희망 = 우선 배치 · 불가 = 방문 제외')

          rep('<td><input class="a" value="${esc(c.address)}" placeholder="도로명주소"></td><td><span class="addrstatus" id="st_${c.id}">미확인</span></td>', '<td><div class="addresscell"><input class="a" value="${esc(c.address)}" placeholder="도로명주소"><span class="addrstatus" id="st_${c.id}">미확인</span></div></td>')

          rep("settings:{centerAddress:DEFAULT_CENTER,appKey:'',startTime:'09:00',lunchStart:'12:00',lunchEnd:'13:00',endTime:'18:00',bufferMins:10,planDate:todayISO()}", "settings:{centerAddress:DEFAULT_CENTER,appKey:'',startTime:'09:00',endTime:'18:00',bufferMins:10,planDate:todayISO()}")
          rep("if(s?.settings)out.settings={...out.settings,...s.settings,bufferMins:Number(s.settings.bufferMins??10)};", "if(s?.settings)out.settings={...out.settings,...s.settings,bufferMins:Number(s.settings.bufferMins??10)};delete out.settings.lunchStart;delete out.settings.lunchEnd;")
          rep("state.settings.startTime=$('startTime').value||'09:00';state.settings.lunchStart=$('lunchStart').value;state.settings.lunchEnd=$('lunchEnd').value;state.settings.endTime", "state.settings.startTime=$('startTime').value||'09:00';state.settings.endTime")
          rep("$('startTime').value=s.startTime||'09:00';$('lunchStart').value=s.lunchStart??'12:00';$('lunchEnd').value=s.lunchEnd??'13:00';$('endTime').value", "$('startTime').value=s.startTime||'09:00';$('endTime').value")
          rep("['centerAddress','appKey','startTime','lunchStart','lunchEnd','endTime','bufferMins','planDate']", "['centerAddress','appKey','startTime','endTime','bufferMins','planDate']")

          s, n = re.subn(r"function lunchRange\(\)\{.*?\}\nfunction serviceBlocks\(rule\)\{.*?\}\nfunction avoidBlocks", "function serviceBlocks(rule){return parseBlocks(rule.blocked)}\nfunction avoidBlocks", s, flags=re.S)
          if n != 1:
              raise SystemExit(f'lunch block replacement count={n}')
          s, n = re.subn(r"function travelArrival\(clock,tr\)\{.*?\}\nfunction evaluateVisit", "function travelArrival(clock,tr){return clock+tr}\nfunction evaluateVisit", s, flags=re.S)
          if n != 1:
              raise SystemExit(f'travelArrival replacement count={n}')
          rep('고정시간이 불가/점심시간과 겹침', '고정시간이 불가시간과 겹침')

          if 'lunchStart' in s.replace('delete out.settings.lunchStart','').replace('delete out.settings.lunchEnd',''):
              raise SystemExit('unexpected lunch setting reference remains')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('bath-route/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          Path('/tmp/bath-route.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/bath-route.js
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bath-route/index.html
          git commit -m "Clean bath route desktop UI and remove lunch" || exit 0
          git push
