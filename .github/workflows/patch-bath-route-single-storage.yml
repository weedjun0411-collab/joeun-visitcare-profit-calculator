name: Patch bath route single storage

on:
  push:
    paths:
      - '.github/workflows/patch-bath-route-single-storage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify browser storage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bath-route/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<span class="pill version">PC v2</span>\n','')
          s = s.replace('저장 방식: IndexedDB를 기본 저장소로 사용하고 localStorage에 한 번 더 복제합니다. 가능하면 브라우저 영구저장을 요청합니다.\n        PC 백업 파일이 연결된 경우 수정할 때마다 파일에도 자동저장하며, 브라우저 데이터가 비어 있을 때는 백업 파일을 임의로 덮어쓰지 않습니다.', '저장 방식: 브라우저 내부 저장소(IndexedDB) 한 곳에 자동저장합니다.\n        PC 백업 파일이 연결된 경우 수정할 때마다 파일에도 자동저장하며, 브라우저 데이터가 비어 있을 때는 백업 파일을 임의로 덮어쓰지 않습니다.')
          s = s.replace("const MIRROR_KEY='joeun_bath_route_pc_v2';\n", '')
          s = s.replace("  if(!s){\n    try{s=JSON.parse(localStorage.getItem(MIRROR_KEY)||'null')}catch(e){}\n  }\n", '')
          s = s.replace("    localStorage.setItem(MIRROR_KEY,JSON.stringify(state));\n", '')
          s = s.replace("        localStorage.setItem(MIRROR_KEY,JSON.stringify(state));\n", '')
          s = s.replace("            localStorage.setItem(MIRROR_KEY,JSON.stringify(state)); renderState();\n", "            renderState();\n")
          s = s.replace("    $('dbPill').textContent=persistent?'브라우저 영구저장':'브라우저 이중저장';", "    $('dbPill').textContent='브라우저 저장';")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bath-route/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Simplify bath route browser storage"
            git push
          fi