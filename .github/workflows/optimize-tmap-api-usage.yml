name: Optimize TMAP API usage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add persistent leg cache and throttling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bath-route/index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace("const DB_NAME='joeunBathRoutePCDB', DB_VERSION=3, OLD_DATA_KEY='joeun_bath_route_clients_v3', OLD_SET_KEY='joeun_bath_route_settings_v3';", "const DB_NAME='joeunBathRoutePCDB', DB_VERSION=4, OLD_DATA_KEY='joeun_bath_route_clients_v3', OLD_SET_KEY='joeun_bath_route_settings_v3';\nconst LEG_CACHE_TTL=24*60*60*1000, API_MIN_INTERVAL=260;let lastRouteApiAt=0,routeApiGate=Promise.resolve();", 1)

          s=s.replace("function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');if(!d.objectStoreNames.contains('handles'))d.createObjectStore('handles');if(!d.objectStoreNames.contains('coords'))d.createObjectStore('coords')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}", "function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');if(!d.objectStoreNames.contains('handles'))d.createObjectStore('handles');if(!d.objectStoreNames.contains('coords'))d.createObjectStore('coords');if(!d.objectStoreNames.contains('legs'))d.createObjectStore('legs')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}", 1)

          old="""async function routeLeg(from,to,key){const k=`${from.lon},${from.lat}>${to.lon},${to.lat}`;if(legMemo.has(k))return legMemo.get(k);const dx=Math.abs(Number(from.lon)-Number(to.lon)),dy=Math.abs(Number(from.lat)-Number(to.lat));if(dx<0.00002&&dy<0.00002){const out={mins:0,path:[]};legMemo.set(k,out);return out}const body={startX:String(from.lon),startY:String(from.lat),endX:String(to.lon),endY:String(to.lat),reqCoordType:'WGS84GEO',resCoordType:'WGS84GEO',searchOption:'0',startName:'출발',endName:'도착'};const r=await fetch('https://apis.openapi.sk.com/tmap/routes?version=1&format=json',{method:'POST',headers:{'Content-Type':'application/json','appKey':key},body:JSON.stringify(body)});const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch(e){}const apiMsg=j?.error?.message||j?.errorMessage||j?.message||'';if(!r.ok||j?.error)throw new Error('TMAP 경로 API 오류'+(apiMsg?': '+apiMsg:' (HTTP '+r.status+')'));const features=Array.isArray(j?.features)?j.features:[];let sec=Number(features?.[0]?.properties?.totalTime)||0,segmentSec=0,path=[];for(const f of features){const total=Number(f?.properties?.totalTime);if(total>sec)sec=total;const seg=Number(f?.properties?.time);if(seg>0)segmentSec+=seg;const g=f?.geometry;if(g?.type==='LineString')for(const p of g.coordinates||[])path.push({lon:Number(p[0]),lat:Number(p[1])});if(g?.type==='MultiLineString')for(const line of g.coordinates||[])for(const p of line)path.push({lon:Number(p[0]),lat:Number(p[1])})}if(!sec&&segmentSec>0)sec=segmentSec;if(!sec)throw new Error('TMAP 이동시간 응답 오류: '+(apiMsg||'이동시간 정보 없음'));const out={mins:Math.max(1,Math.round(sec/60)),path};legMemo.set(k,out);return out}"""
          new="""const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function legKey(from,to){const f=n=>Number(n).toFixed(5);return `${f(from.lon)},${f(from.lat)}>${f(to.lon)},${f(to.lat)}`}
async function getLegCache(k,needPath=false){const v=await idbGet('legs',k).catch(()=>null);if(!v||Date.now()-Number(v.savedAt||0)>LEG_CACHE_TTL)return null;if(needPath&&!(Array.isArray(v.path)&&v.path.length>1))return null;return{mins:Number(v.mins)||0,path:Array.isArray(v.path)?v.path:[],cached:true}}
async function putLegCache(k,out,keepPath=false){await idbPut('legs',k,{mins:out.mins,path:keepPath?out.path:[],savedAt:Date.now()}).catch(()=>{})}
async function waitRouteApiTurn(){const run=routeApiGate.then(async()=>{const gap=Date.now()-lastRouteApiAt,wait=Math.max(0,API_MIN_INTERVAL-gap);if(wait)await sleep(wait);lastRouteApiAt=Date.now()});routeApiGate=run.catch(()=>{});return run}
async function routeLeg(from,to,key,needPath=false){
 const k=legKey(from,to),mem=legMemo.get(k);if(mem&&(!needPath||mem.path?.length>1))return mem;
 const cached=await getLegCache(k,needPath);if(cached){legMemo.set(k,cached);return cached}
 const dx=Math.abs(Number(from.lon)-Number(to.lon)),dy=Math.abs(Number(from.lat)-Number(to.lat));if(dx<0.00002&&dy<0.00002){const out={mins:0,path:[],cached:true};legMemo.set(k,out);return out}
 const body={startX:String(from.lon),startY:String(from.lat),endX:String(to.lon),endY:String(to.lat),reqCoordType:'WGS84GEO',resCoordType:'WGS84GEO',searchOption:'0',startName:'출발',endName:'도착'};
 let lastErr='';
 for(let attempt=0;attempt<4;attempt++){
  await waitRouteApiTurn();
  const r=await fetch('https://apis.openapi.sk.com/tmap/routes?version=1&format=json',{method:'POST',headers:{'Content-Type':'application/json','appKey':key},body:JSON.stringify(body)});
  const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch(e){}
  const apiMsg=j?.error?.message||j?.errorMessage||j?.message||'';lastErr=apiMsg||('HTTP '+r.status);
  if(!r.ok||j?.error){if(/limit exceeded/i.test(lastErr)&&attempt<3){await sleep(900*Math.pow(2,attempt));continue}throw new Error('TMAP 경로 API 오류'+(apiMsg?': '+apiMsg:' (HTTP '+r.status+')'))}
  const features=Array.isArray(j?.features)?j.features:[];let sec=Number(features?.[0]?.properties?.totalTime)||0,segmentSec=0,path=[];
  for(const f of features){const total=Number(f?.properties?.totalTime);if(total>sec)sec=total;const seg=Number(f?.properties?.time);if(seg>0)segmentSec+=seg;const g=f?.geometry;if(g?.type==='LineString')for(const p of g.coordinates||[])path.push({lon:Number(p[0]),lat:Number(p[1])});if(g?.type==='MultiLineString')for(const line of g.coordinates||[])for(const p of line)path.push({lon:Number(p[0]),lat:Number(p[1])})}
  if(!sec&&segmentSec>0)sec=segmentSec;if(!sec)throw new Error('TMAP 이동시간 응답 오류: '+(apiMsg||'이동시간 정보 없음'));
  const out={mins:Math.max(1,Math.round(sec/60)),path,cached:false};legMemo.set(k,out);await putLegCache(k,out,needPath);return out
 }
 throw new Error('TMAP 경로 API 오류: '+(lastErr||'요청 한도 초과'))
}"""
          if old not in s:
              raise SystemExit('routeLeg block not found')
          s=s.replace(old,new,1)

          old2="""async function buildMatrix(nodes,key){const pairs=[];for(const a of nodes)for(const b of nodes)if(a.id!==b.id)pairs.push([a,b]);let done=0;const matrix={};for(const n of nodes)matrix[n.id]={};await mapLimit(pairs,4,async([a,b])=>{const leg=await routeLeg(a.coord,b.coord,key);matrix[a.id][b.id]=leg.mins;done++;if(done%4===0||done===pairs.length)progress(`실제 도로 이동시간 계산 중 ${done}/${pairs.length}`)});return matrix}"""
          new2="""async function buildMatrix(nodes,key){const pairs=[];for(const a of nodes)for(const b of nodes)if(a.id!==b.id)pairs.push([a,b]);let done=0,cached=0,api=0;const matrix={};for(const n of nodes)matrix[n.id]={};await mapLimit(pairs,2,async([a,b])=>{const leg=await routeLeg(a.coord,b.coord,key,false);matrix[a.id][b.id]=leg.mins;done++;leg.cached?cached++:api++;if(done%4===0||done===pairs.length)progress(`이동시간 계산 ${done}/${pairs.length} · 저장값 ${cached} · TMAP 호출 ${api}`)});return matrix}"""
          if old2 not in s:
              raise SystemExit('buildMatrix block not found')
          s=s.replace(old2,new2,1)
          s=s.replace("const leg=await routeLeg(a.coord,b.coord,state.settings.appKey);legs.push({path:leg.path})", "const leg=await routeLeg(a.coord,b.coord,state.settings.appKey,true);legs.push({path:leg.path})", 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/optimize-tmap-api-usage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bath-route/index.html .github/workflows/optimize-tmap-api-usage.yml
          git commit -m "Cache TMAP travel times and throttle route requests"
          git push