<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>조은 방문목욕 동선표</title><style>body{font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif;margin:0;background:#edf1f5;color:#172033}.loading{max-width:760px;margin:100px auto;background:#fff;border:1px solid #d8e0e8;border-radius:14px;padding:28px;text-align:center}.loading b{display:block;font-size:18px;margin-bottom:8px}.loading span{font-size:12px;color:#667085}.err{color:#b42318;white-space:pre-wrap}</style></head><body><div class="loading" id="boot"><b>조은 방문목욕 동선표 불러오는 중</b><span>TMAP API 절약 모드 적용 중...</span></div><script>
(async()=>{
const RAW='https://raw.githubusercontent.com/weedjun0411-collab/joeun-visitcare-profit-calculator/fde7ef216019c7cde4c3474ca11d490bb39ede4c/bath-route/index.html';
const API='https://api.github.com/repos/weedjun0411-collab/joeun-visitcare-profit-calculator/contents/bath-route/index.html?ref=fde7ef216019c7cde4c3474ca11d490bb39ede4c';
async function getBase(){try{const r=await fetch(RAW,{cache:'no-store'});if(r.ok)return await r.text()}catch(e){}const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error('기본 화면을 불러오지 못했습니다.');const j=await r.json();return decodeURIComponent(escape(atob((j.content||'').replace(/\s/g,''))))}
function patch(s){
 s=s.replace("const DB_NAME='joeunBathRoutePCDB', DB_VERSION=3, OLD_DATA_KEY='joeun_bath_route_clients_v3', OLD_SET_KEY='joeun_bath_route_settings_v3';", "const DB_NAME='joeunBathRoutePCDB', DB_VERSION=4, OLD_DATA_KEY='joeun_bath_route_clients_v3', OLD_SET_KEY='joeun_bath_route_settings_v3';\nconst LEG_CACHE_TTL=24*60*60*1000,API_MIN_INTERVAL=300;let lastRouteApiAt=0,routeApiGate=Promise.resolve();");
 s=s.replace("function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');if(!d.objectStoreNames.contains('handles'))d.createObjectStore('handles');if(!d.objectStoreNames.contains('coords'))d.createObjectStore('coords')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}","function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');if(!d.objectStoreNames.contains('handles'))d.createObjectStore('handles');if(!d.objectStoreNames.contains('coords'))d.createObjectStore('coords');if(!d.objectStoreNames.contains('legs'))d.createObjectStore('legs')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}");
 const leg=`const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function legKey(from,to){const f=n=>Number(n).toFixed(5);return \`${'${f(from.lon)},${f(from.lat)}>${f(to.lon)},${f(to.lat)}'}\`}
async function getLegCache(k,needPath=false){const v=await idbGet('legs',k).catch(()=>null);if(!v||Date.now()-Number(v.savedAt||0)>LEG_CACHE_TTL)return null;if(needPath&&!(Array.isArray(v.path)&&v.path.length>1))return null;return{mins:Number(v.mins)||0,path:Array.isArray(v.path)?v.path:[],cached:true}}
async function putLegCache(k,out,keepPath=false){await idbPut('legs',k,{mins:out.mins,path:keepPath?out.path:[],savedAt:Date.now()}).catch(()=>{})}
async function waitRouteApiTurn(){const run=routeApiGate.then(async()=>{const gap=Date.now()-lastRouteApiAt,wait=Math.max(0,API_MIN_INTERVAL-gap);if(wait)await sleep(wait);lastRouteApiAt=Date.now()});routeApiGate=run.catch(()=>{});return run}
async function routeLeg(from,to,key,needPath=false){
 const k=legKey(from,to),mem=legMemo.get(k);if(mem&&(!needPath||mem.path?.length>1))return mem;
 const cached=await getLegCache(k,needPath);if(cached){legMemo.set(k,cached);return cached}
 const dx=Math.abs(Number(from.lon)-Number(to.lon)),dy=Math.abs(Number(from.lat)-Number(to.lat));if(dx<0.00002&&dy<0.00002){const out={mins:0,path:[],cached:true};legMemo.set(k,out);return out}
 const body={startX:String(from.lon),startY:String(from.lat),endX:String(to.lon),endY:String(to.lat),reqCoordType:'WGS84GEO',resCoordType:'WGS84GEO',searchOption:'0',startName:'출발',endName:'도착'};let lastErr='';
 for(let attempt=0;attempt<4;attempt++){await waitRouteApiTurn();const r=await fetch('https://apis.openapi.sk.com/tmap/routes?version=1&format=json',{method:'POST',headers:{'Content-Type':'application/json','appKey':key},body:JSON.stringify(body)});const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch(e){}const apiMsg=j?.error?.message||j?.errorMessage||j?.message||'';lastErr=apiMsg||('HTTP '+r.status);if(!r.ok||j?.error){if(/limit exceeded/i.test(lastErr)&&attempt<3){await sleep(1000*Math.pow(2,attempt));continue}throw new Error('TMAP 경로 API 오류'+(apiMsg?': '+apiMsg:' (HTTP '+r.status+')'))}const features=Array.isArray(j?.features)?j.features:[];let sec=Number(features?.[0]?.properties?.totalTime)||0,segmentSec=0,path=[];for(const f of features){const total=Number(f?.properties?.totalTime);if(total>sec)sec=total;const seg=Number(f?.properties?.time);if(seg>0)segmentSec+=seg;const g=f?.geometry;if(g?.type==='LineString')for(const p of g.coordinates||[])path.push({lon:Number(p[0]),lat:Number(p[1])});if(g?.type==='MultiLineString')for(const line of g.coordinates||[])for(const p of line)path.push({lon:Number(p[0]),lat:Number(p[1])})}if(!sec&&segmentSec>0)sec=segmentSec;if(!sec)throw new Error('TMAP 이동시간 응답 오류: '+(apiMsg||'이동시간 정보 없음'));const out={mins:Math.max(1,Math.round(sec/60)),path,cached:false};legMemo.set(k,out);await putLegCache(k,out,needPath);return out}throw new Error('TMAP 경로 API 오류: '+(lastErr||'요청 한도 초과'))}
async function mapLimit`;
 s=s.replace(/async function routeLeg\(from,to,key\)\{[\s\S]*?\}\nasync function mapLimit/,leg);
 const matrix=`async function buildMatrix(nodes,key){const pairs=[];for(const a of nodes)for(const b of nodes)if(a.id!==b.id)pairs.push([a,b]);let done=0,cached=0,api=0;const matrix={};for(const n of nodes)matrix[n.id]={};await mapLimit(pairs,2,async([a,b])=>{const leg=await routeLeg(a.coord,b.coord,key,false);matrix[a.id][b.id]=leg.mins;done++;leg.cached?cached++:api++;if(done%4===0||done===pairs.length)progress(\`이동시간 계산 ${'${done}'}/${'${pairs.length}'} · 저장값 ${'${cached}'} · TMAP 호출 ${'${api}'}\`)});return matrix}
function ruleFor`;
 s=s.replace(/async function buildMatrix\(nodes,key\)\{[\s\S]*?\}\nfunction ruleFor/,matrix);
 s=s.replace("const leg=await routeLeg(a.coord,b.coord,state.settings.appKey);legs.push({path:leg.path})","const leg=await routeLeg(a.coord,b.coord,state.settings.appKey,true);legs.push({path:leg.path})");
 return s;
}
try{const base=await getBase(),html=patch(base);document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<b class="err">페이지 로딩 실패</b><span class="err">'+String(e.message||e)+'</span>'}
})();
</script></body></html>
